server {
    listen 443 ssl http2;
    server_name portal.nivesh.gov.in;

    ssl_certificate     /etc/nivesh/certs/citizen-portal.pem;
    ssl_certificate_key /etc/nivesh/private/citizen-portal.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_ecdh_curve secp384r1:prime256v1;
    ssl_session_tickets on;
}
