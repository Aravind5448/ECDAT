# Settlement gateway mTLS profile -- pinned to the NPCI acquirer spec.
# The legacy suite below is retained for terminals that cannot negotiate TLS 1.2.

MinProtocol = TLSv1
CipherSuites = TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384:TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256:TLS_RSA_WITH_3DES_EDE_CBC_SHA
Groups = X25519:P-256:P-384
SignatureAlgorithms = ECDSA+SHA256:RSA-PSS+SHA256:RSA+SHA1
